<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzleverse Productions · Coming Soon</title>
<meta name="description" content="Puzzleverse Productions. Video, animation, music, and creative tooling since 2004. Full site coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --tape-black: #0c0b10;
    --phosphor: #e8e6df;
    --osd-cyan: #5ee3e6;
    --bleed-magenta: #ff3d7f;
    --bleed-cyan: #2bd9e0;
    --label-cream: #efe3c2;
    --dim: #8a8794;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--tape-black);
    color: var(--phosphor);
    font-family: "VT323", monospace;
    overflow: hidden;
    position: relative;
  }

  /* faint CRT vignette */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
    pointer-events: none;
    z-index: 4;
  }

  /* scanlines */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.028) 0px,
      rgba(255,255,255,.028) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 5;
  }

  #static {
    position: fixed;
    inset: 0;
    opacity: .05;
    pointer-events: none;
    z-index: 3;
    width:100%;
    height:100%;
  }

  /* ---- OSD corners ---- */
  .osd {
    position: fixed;
    font-size: clamp(18px, 2.6vw, 26px);
    letter-spacing: .08em;
    color: var(--osd-cyan);
    text-shadow: 0 0 8px rgba(94,227,230,.55);
    z-index: 6;
    user-select: none;
  }
  .osd-play { top: 22px; left: 26px; }
  .osd-play .tri { display: inline-block; animation: blink 1.6s steps(1) infinite; }
  .osd-counter { top: 22px; right: 26px; font-variant-numeric: tabular-nums; }
  .osd-mode { bottom: 22px; left: 26px; color: var(--dim); text-shadow: none; }
  .osd-tracking { bottom: 22px; right: 26px; color: var(--dim); text-shadow: none; }

  @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }

  /* ---- center stage ---- */
  main {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 26px;
  }

  .wordmark {
    font-family: "Bungee", sans-serif;
    font-size: clamp(2.1rem, 8.5vw, 6.2rem);
    line-height: .95;
    color: var(--phosphor);
    position: relative;
    letter-spacing: .01em;
  }
  .wordmark span { display: block; }
  .wordmark .sub {
    font-size: clamp(.9rem, 3vw, 2rem);
    letter-spacing: .42em;
    margin-top: 10px;
    color: var(--dim);
  }

  /* RGB-split ghosts */
  .wordmark .main-line { position: relative; }
  .wordmark .main-line::before,
  .wordmark .main-line::after {
    content: "PUZZLEVERSE";
    position: absolute;
    inset: 0;
    opacity: 0;
  }
  .wordmark .main-line::before { color: var(--bleed-magenta); }
  .wordmark .main-line::after { color: var(--bleed-cyan); }

  .glitching .main-line::before {
    opacity: .8;
    animation: split-m .38s steps(2, end) 1;
  }
  .glitching .main-line::after {
    opacity: .8;
    animation: split-c .38s steps(2, end) 1;
  }
  @keyframes split-m {
    0% { transform: translate(-6px, 2px); clip-path: inset(10% 0 55% 0); }
    50% { transform: translate(4px, -2px); clip-path: inset(60% 0 5% 0); }
    100% { transform: translate(0, 0); clip-path: inset(0 0 0 0); opacity: 0; }
  }
  @keyframes split-c {
    0% { transform: translate(6px, -2px); clip-path: inset(55% 0 10% 0); }
    50% { transform: translate(-4px, 2px); clip-path: inset(5% 0 60% 0); }
    100% { transform: translate(0, 0); clip-path: inset(0 0 0 0); opacity: 0; }
  }

  /* tape label */
  .label {
    font-family: "VT323", monospace;
    background: var(--label-cream);
    color: #16141c;
    font-size: clamp(1.3rem, 3.4vw, 2rem);
    letter-spacing: .3em;
    padding: 8px 26px 6px 30px;
    transform: rotate(-1.2deg);
    box-shadow: 0 2px 0 rgba(0,0,0,.5);
    border-left: 10px solid var(--bleed-magenta);
  }

  .line {
    font-size: clamp(1.2rem, 2.8vw, 1.7rem);
    color: var(--dim);
    max-width: 34ch;
    line-height: 1.35;
  }
  .line b { color: var(--phosphor); font-weight: normal; }

  .cta {
    font-family: "VT323", monospace;
    font-size: clamp(1.25rem, 2.8vw, 1.6rem);
    letter-spacing: .06em;
    color: var(--osd-cyan);
    text-decoration: none;
    border: 2px solid var(--osd-cyan);
    padding: 10px 26px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    transition: background .15s ease, color .15s ease, box-shadow .15s ease;
    text-shadow: 0 0 8px rgba(94,227,230,.4);
  }
  .cta:hover, .cta:focus-visible {
    background: var(--osd-cyan);
    color: var(--tape-black);
    text-shadow: none;
    box-shadow: 0 0 24px rgba(94,227,230,.35);
  }
  .cta:focus-visible { outline: 3px dashed var(--phosphor); outline-offset: 4px; }
  .cta .tri { font-size: .8em; }

  footer {
    position: fixed;
    bottom: 60px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(1rem, 2.2vw, 1.2rem);
    color: var(--dim);
    letter-spacing: .18em;
    z-index: 2;
  }

  @media (max-width: 560px) {
    .osd-mode, .osd-tracking { display: none; }
    footer { bottom: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .osd-play .tri { animation: none; }
    .glitching .main-line::before,
    .glitching .main-line::after { animation: none; opacity: 0; }
    #static { display: none; }
  }
</style>
</head>
<body>

<canvas id="static" aria-hidden="true"></canvas>

<div class="osd osd-play" aria-hidden="true"><span class="tri">&#9654;</span> PLAY</div>
<div class="osd osd-counter" aria-hidden="true">SP 0:00:00</div>
<div class="osd osd-mode" aria-hidden="true">SOURCE: PUZZLEVERSE.PRODUCTIONS</div>
<div class="osd osd-tracking" aria-hidden="true">TRACKING&#8230;</div>

<main>
  <h1 class="wordmark" id="wordmark">
    <span class="main-line">PUZZLEVERSE</span>
    <span class="sub">PRODUCTIONS</span>
  </h1>

  <div class="label">COMING SOON</div>

  <p class="line">Video, animation, music, and homemade tools. The full site is still rendering. <br/><b>Every piece clicks eventually.</b></p>

  <a class="cta" href="https://www.youtube.com/@tomvelle" rel="me">
    <span class="tri">&#9654;</span> WATCH THE ARCHIVE ON YOUTUBE
  </a>
</main>

<footer>PUZZLEVERSE PRODUCTIONS &middot; EST. 2004</footer>

<script>
  // VCR tape counter, counting from page load
  const counter = document.querySelector('.osd-counter');
  const start = Date.now();
  function tick() {
    const s = Math.floor((Date.now() - start) / 1000);
    const h = Math.floor(s / 3600);
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
    const sec = String(s % 60).padStart(2, '0');
    counter.textContent = 'SP ' + h + ':' + m + ':' + sec;
  }
  tick();
  setInterval(tick, 1000);

  // occasional RGB-split glitch on the wordmark
  const wm = document.getElementById('wordmark');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function glitch() {
    if (!reduced) {
      wm.classList.add('glitching');
      setTimeout(() => wm.classList.remove('glitching'), 400);
    }
    setTimeout(glitch, 2600 + Math.random() * 4200);
  }
  setTimeout(glitch, 1400);

  // low-key animated static
  const canvas = document.getElementById('static');
  const ctx = canvas.getContext('2d');
  function resize() {
    canvas.width = Math.floor(window.innerWidth / 3);
    canvas.height = Math.floor(window.innerHeight / 3);
  }
  window.addEventListener('resize', resize);
  resize();
  function noise() {
    if (reduced) return;
    const img = ctx.createImageData(canvas.width, canvas.height);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(() => setTimeout(noise, 90));
  }
  noise();
</script>

</body>
</html>
