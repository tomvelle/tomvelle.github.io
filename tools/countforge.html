<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CountForge</title>
<style>
:root {
  --ink: #141116;
  --panel: #1c1820;
  --panel2: #231e28;
  --raise: #2e2835;
  --line: #3a3342;
  --line2: #51485c;
  --bone: #ece5d6;
  --dim: #b0a7b9;
  --faint: #7d7488;
  --blood: #c92c27;
  --blood2: #ea4a41;
  --ok: #8fd14f;
  --r: 5px;
  --ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --head: "Oswald", "Arial Narrow", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ink); color: var(--bone);
  font: 13px/1.35 var(--ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

#app {
  display: grid; height: 100vh;
  grid-template-columns: 92px 348px minmax(0, 1fr);
  grid-template-rows: 52px minmax(0, 1fr);
  grid-template-areas: "top top top" "rail panel stage";
}

/* ---------- top bar ---------- */
#top {
  grid-area: top; display: flex; align-items: center; gap: 12px;
  padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; color: var(--bone); padding-right: 6px; }
.brand span { font: 400 23px/1 "Anton", var(--head); letter-spacing: .035em; }
#projName {
  width: 230px; background: transparent; border: 1px solid transparent; border-radius: var(--r);
  padding: 6px 9px; font: 500 15px/1.2 var(--head); letter-spacing: .01em;
}
#projName:hover { border-color: var(--line); }
#projName:focus { border-color: var(--line2); background: var(--ink); outline: none; }
.tb { display: flex; }
.tb button { border-radius: 0; margin-left: -1px; }
.tb button:first-child { border-radius: var(--r) 0 0 var(--r); margin-left: 0; }
.tb button:last-child { border-radius: 0 var(--r) var(--r) 0; }
#readout {
  flex: 1; min-width: 0; text-align: right; color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px;
}
#readout b { color: var(--bone); font-weight: 600; }

button {
  background: var(--raise); border: 1px solid var(--line); border-radius: var(--r);
  padding: 6px 11px; cursor: pointer; line-height: 1.2;
}
button:hover { border-color: var(--line2); background: #362f3e; }
button:active { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--blood); border-color: var(--blood); color: #fff; font-weight: 600; }
button.primary:hover { background: var(--blood2); border-color: var(--blood2); }
button.ghost { background: transparent; }
button.small { padding: 3px 8px; font-size: 12px; }
button.on { background: var(--bone); color: var(--ink); border-color: var(--bone); }
:focus-visible { outline: 2px solid var(--bone); outline-offset: 1px; }

/* ---------- rail ---------- */
#rail {
  grid-area: rail; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 8px 0; overflow-y: auto;
}
#rail button {
  background: transparent; border: 0; border-left: 3px solid transparent; border-radius: 0;
  padding: 11px 6px 11px 13px; text-align: left; color: var(--dim);
  font: 500 15.5px/1 var(--head); letter-spacing: .02em;
}
#rail button:hover { color: var(--bone); background: var(--panel2); }
#rail button.on { color: var(--bone); border-left-color: var(--blood2); background: var(--panel2); }
#rail .spacer { flex: 1; }
#rail button.about { font-size: 12.5px; color: var(--faint); }

/* ---------- panel ---------- */
#panel {
  grid-area: panel; background: var(--panel2); border-right: 1px solid var(--line);
  overflow-y: auto; overflow-x: hidden; padding: 0 0 40px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent;
}
.ptitle { padding: 14px 14px 4px; font: 500 20px/1.1 var(--head); }
.plede { padding: 0 14px 10px; color: var(--dim); font-size: 12.5px; }
details.sec { border-top: 1px solid var(--line); }
details.sec > summary {
  list-style: none; cursor: pointer; padding: 9px 14px; font: 500 14.5px/1.2 var(--head); letter-spacing: .015em;
  display: flex; align-items: center; gap: 8px; user-select: none;
}
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before {
  content: ""; width: 0; height: 0; border-left: 5px solid var(--faint);
  border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .12s;
}
details.sec[open] > summary::before { transform: rotate(90deg); }
details.sec > summary:hover { background: var(--raise); }
.body { padding: 2px 14px 12px; }
.row { display: grid; grid-template-columns: 108px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 28px; margin: 3px 0; }
.row .lab { color: var(--dim); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .ctl { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row.wide { grid-template-columns: minmax(0, 1fr); }
.row.wide .ctl { flex-wrap: wrap; }
.note { color: var(--faint); font-size: 12px; margin: 4px 0 8px; line-height: 1.4; }
.note b { color: var(--dim); font-weight: 600; }
.sub { margin: 10px 0 2px; color: var(--bone); font: 500 13px/1.2 var(--head); letter-spacing: .02em; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }

input[type=text], input[type=number], select, textarea {
  background: var(--ink); border: 1px solid var(--line); border-radius: var(--r);
  padding: 5px 7px; min-width: 0; width: 100%;
}
input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { border-color: var(--line2); outline: none; }
input[type=number] { width: 62px; flex: none; padding-right: 2px; }
input[type=number].w { width: 100%; }
select { padding-right: 2px; }
input[type=checkbox] { accent-color: var(--blood2); width: 15px; height: 15px; margin: 0; flex: none; }
label.chk { display: flex; align-items: center; gap: 7px; cursor: pointer; }
input[type=color] {
  width: 30px; height: 26px; padding: 0; border: 1px solid var(--line2); border-radius: var(--r); background: none; flex: none; cursor: pointer;
}
input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
input[type=color]::-webkit-color-swatch { border: 0; border-radius: 3px; }
select.link { width: auto; flex: 1; min-width: 0; color: var(--dim); font-size: 12px; padding: 4px 2px 4px 5px; }

input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 22px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--line2); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 4px; background: var(--line2); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--bone); margin-top: -4.5px; border: 0; }
input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--bone); border: 0; }
input[type=range]:hover::-webkit-slider-thumb { background: #fff; }

.chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 14px 10px; }
.chips button { padding: 5px 10px; font-size: 12.5px; }

/* looks */
.looks { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 6px 0 4px; }
.looks button { text-align: left; padding: 8px 9px; display: flex; flex-direction: column; gap: 6px; }
.looks .sw { display: flex; height: 12px; border-radius: 2px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); }
.looks .sw i { flex: 1; }
.looks button.on { border-color: var(--bone); background: var(--raise); color: var(--bone); }
.pal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px 8px; margin: 6px 0; }
.pal label { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; min-width: 0; }
.pal label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* tiers */
.tiers { display: flex; flex-direction: column; gap: 5px; margin: 6px 0; }
.tier { display: grid; grid-template-columns: 30px minmax(0, 1fr) 62px 26px; gap: 6px; align-items: center; }
.tier button { padding: 4px 0; }
.tierhead { display: grid; grid-template-columns: 30px minmax(0, 1fr) 62px 26px; gap: 6px; color: var(--faint); font-size: 11.5px; }
.scale { margin: 10px 0 4px; }
.scale .zones { display: flex; height: 30px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line2); position: relative; background: var(--ink); }
.scale .zone { height: 100%; opacity: .32; border-right: 2px solid var(--ink); }
.scale .zone:last-child { border-right: 0; }
.scale .done { position: absolute; left: 0; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.0) 0 0); border-right: 3px solid #fff; box-shadow: 4px 0 10px rgba(255,255,255,.35); pointer-events: none; }
.scale .litwrap { position: absolute; inset: 0; display: flex; pointer-events: none; }
.scale .lit { height: 100%; border-right: 2px solid var(--ink); }
.scale .names { display: flex; margin-top: 4px; }
.scale .names div { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; line-height: 1.25; min-width: 0; flex: none; }
.scale .names b { display: block; color: var(--bone); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.verdict { margin: 8px 0 2px; padding: 8px 10px; background: var(--ink); border: 1px solid var(--line); border-radius: var(--r); font-size: 12.5px; color: var(--dim); line-height: 1.45; }
.verdict b { color: var(--bone); }

/* lists */
.list { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.item { display: flex; align-items: center; gap: 7px; padding: 5px 7px; background: var(--ink); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; }
.item.on { border-color: var(--bone); }
.item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .tag { color: var(--faint); font-size: 11.5px; }
.item img, .thumb { width: 34px; height: 24px; object-fit: contain; background: repeating-conic-gradient(#2f2936 0% 25%, #251f2b 0% 50%) 0 0/10px 10px; border-radius: 3px; flex: none; }
.item button { padding: 2px 7px; }
.empty { border: 1px dashed var(--line2); border-radius: var(--r); padding: 12px; color: var(--dim); font-size: 12.5px; text-align: center; }

.steps { margin: 6px 0 0; padding-left: 18px; color: var(--dim); font-size: 12.5px; line-height: 1.5; }
.steps b { color: var(--bone); font-weight: 600; }
.steps code, .note code { font: 12px/1 Consolas, "Courier New", monospace; color: var(--bone); background: var(--ink); padding: 1px 4px; border-radius: 3px; }

/* ---------- stage ---------- */
#stage { grid-area: stage; position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #0d0b0f; }
#scroller { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 16px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
#sheet { position: relative; margin: auto; flex: none; box-shadow: 0 0 0 1px #000, 0 10px 40px rgba(0,0,0,.6); }
#sheet.bg-check { background: repeating-conic-gradient(#2c2632 0% 25%, #221d27 0% 50%) 0 0/22px 22px; }
#sheet.bg-black { background: #000; }
#sheet.bg-grey { background: #6b6b6b; }
#sheet.bg-white { background: #fff; }
#sheet canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#ov { touch-action: none; }
#phone { position: absolute; right: 14px; top: 14px; background: #000; border: 1px solid var(--line2); border-radius: 6px; padding: 5px 5px 2px; box-shadow: 0 8px 28px rgba(0,0,0,.7); }
#phone canvas { display: block; }
#phone span { display: block; text-align: center; color: var(--faint); font-size: 11px; padding: 2px 0; }
#drophint { position: absolute; inset: 10px; border: 2px dashed var(--bone); border-radius: 10px; display: flex; align-items: center; justify-content: center; font: 500 22px var(--head); background: rgba(20,17,22,.72); pointer-events: none; }

#transport {
  flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 14px;
  background: var(--panel); border-top: 1px solid var(--line); min-height: 50px;
}
#transport .cnt { font: 400 24px/1 "Anton", var(--head); min-width: 46px; text-align: right; }
#transport .ttl { color: var(--dim); font-size: 12.5px; flex: 0 1 180px; min-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#transport button, #transport select { flex: none; white-space: nowrap; }
#transport .ttl b { color: var(--bone); font-weight: 600; }
#transport .scrub { flex: 1 1 120px; min-width: 90px; position: relative; height: 26px; }
#transport .scrub .zones { position: absolute; left: 6px; right: 6px; top: 9px; height: 8px; display: flex; border-radius: 4px; overflow: hidden; }
#transport .scrub .zones i { height: 100%; opacity: .55; }
#transport .scrub input { position: absolute; inset: 0; width: 100%; height: 26px; }
#transport .scrub input::-webkit-slider-runnable-track { background: transparent; }
#transport .scrub input::-moz-range-track { background: transparent; }
#transport .scrub input::-webkit-slider-thumb { width: 12px; height: 22px; border-radius: 3px; margin-top: -9px; box-shadow: 0 0 0 2px var(--panel); }
#transport .scrub input::-moz-range-thumb { width: 12px; height: 22px; border-radius: 3px; box-shadow: 0 0 0 2px var(--panel); }
#transport select { width: auto; }
#transport .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }

/* ---------- toast + modal ---------- */
#toast { position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 60; }
#toast div { background: var(--bone); color: var(--ink); padding: 8px 14px; border-radius: 6px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.5); max-width: 70vw; }
#toast div.bad { background: var(--blood2); color: #fff; }
#modal { position: fixed; inset: 0; background: rgba(8,6,10,.72); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.dialog { background: var(--panel2); border: 1px solid var(--line2); border-radius: 9px; width: min(560px, 100%); max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 20px 70px rgba(0,0,0,.7); }
.dialog h2 { margin: 0; padding: 15px 18px 6px; font: 500 20px/1.2 var(--head); }
.dialog .dbody { padding: 4px 18px 12px; overflow: auto; color: var(--dim); line-height: 1.5; }
.dialog .dbody p { margin: 6px 0; }
.dialog .dbody pre { white-space: pre-wrap; font: 11.5px/1.45 Consolas, "Courier New", monospace; color: var(--dim); background: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 10px; max-height: 46vh; overflow: auto; }
.dialog .dfoot { padding: 10px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; }
.bar { height: 10px; background: var(--ink); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin: 10px 0 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .1s linear; }

@media (max-width: 1000px) {
  body { overflow: auto; }
  #app { height: auto; min-height: 100vh; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 62vh auto; grid-template-areas: "top" "rail" "stage" "panel"; }
  #top { flex-wrap: wrap; padding: 8px 12px; height: auto; }
  #readout { flex-basis: 100%; text-align: left; order: 9; }
  #rail { flex-direction: row; padding: 0; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  #rail button { border-left: 0; border-bottom: 3px solid transparent; padding: 10px 12px; white-space: nowrap; }
  #rail button.on { border-bottom-color: var(--blood2); }
  #rail .spacer { display: none; }
  #panel { border-right: 0; border-top: 1px solid var(--line); }
  #transport { flex-wrap: wrap; }
  #transport .ttl { width: auto; flex: 1; }
  #transport .scrub { flex-basis: 100%; order: 9; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand" title="CountForge">
      <svg viewBox="0 0 40 28" width="34" height="24" aria-hidden="true">
        <g stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
          <line x1="6" y1="4" x2="5" y2="24"/><line x1="14" y1="4" x2="13" y2="24"/>
          <line x1="22" y1="4" x2="21" y2="24"/><line x1="30" y1="4" x2="29" y2="24"/>
        </g>
        <line x1="2" y1="20" x2="37" y2="7" stroke="var(--blood2)" stroke-width="3.6" stroke-linecap="round"/>
      </svg>
      <span>CountForge</span>
    </div>
    <input id="projName" type="text" spellcheck="false" aria-label="Project name" title="Project name">
    <div class="tb">
      <button id="btnNew" title="Start a new project">New</button>
      <button id="btnOpen" title="Open a project file">Open</button>
      <button id="btnSave" title="Save the project file (Ctrl+S)">Save</button>
    </div>
    <div class="tb">
      <button id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="btnRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
    </div>
    <div id="readout" title="Where this video finishes on the scale"></div>
    <button id="btnExport" class="primary" title="Open the export tab">Export</button>
  </header>

  <nav id="rail" aria-label="Sections"></nav>
  <aside id="panel" aria-label="Settings"></aside>

  <main id="stage">
    <div id="scroller"><div id="sheet"><canvas id="pv"></canvas><canvas id="ov"></canvas></div></div>
    <div id="phone" hidden><canvas id="ph"></canvas><span>Phone size</span></div>
    <div id="drophint" hidden>Drop to add</div>
    <div id="transport"></div>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden></div>
<input id="filePick" type="file" hidden>

<script>
(function () {
'use strict';
// ---- 00-core.js ----
// Small helpers shared by everything else.
const APP = 'CountForge';
const VERSION = '1.0';

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) {
    // "value" goes last so range inputs already know their min, max and step
    const keys = Object.keys(props).filter(k => k !== 'value');
    if ('value' in props) keys.push('value');
    for (const k of keys) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else if (k === 'html') e.innerHTML = v;
      else if (k in e && k !== 'list' && k !== 'type') { try { e[k] = v; } catch (_) { e.setAttribute(k, v); } }
      else e.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const k of kids.flat(3)) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const r2 = v => Math.round(v * 100) / 100;
const TAU = Math.PI * 2;

function uid(p) { return (p || 'i') + Math.random().toString(36).slice(2, 9); }
function slug(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'untitled'; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Deep merge "over" into "base" (arrays and scalars are replaced). Returns base.
function merge(base, over) {
  if (over == null) return base;
  for (const k in over) {
    const v = over[k];
    if (v === undefined) continue;
    const b = base[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && b && typeof b === 'object' && !Array.isArray(b)) merge(b, v);
    else base[k] = (v && typeof v === 'object') ? clone(v) : v;
  }
  return base;
}

function getPath(o, path) {
  const ks = path.split('.');
  for (let i = 0; i < ks.length; i++) { if (o == null) return undefined; o = o[ks[i]]; }
  return o;
}
function setPath(o, path, v) {
  const ks = path.split('.');
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = v;
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}
// mulberry32: small seeded generator so textures look the same in the preview and in every export
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- color ----------
function hexToRgb(h) {
  h = String(h || '').trim();
  if (h[0] === '#') h = h.slice(1);
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h.slice(0, 6), 16);

// Builds the list of files for the current settings. Call after setEnv() at export size.
function exportPlan(only) {
  const e = P.exp, pre = pfx(), jobs = [], list = countList(P), S = CUR.S;
  const png = (path, draw) => jobs.push({ path, type: 'png', draw });
  const used = new Set();
  const uniq = name => { let n = name, i = 2; while (used.has(n)) n = name + '_' + i++; used.add(n); return n; };
  if (only !== 'fx') {
    if (e.base && !e.flat) {
      png(pre + 'base.png', ctx => renderStatic(ctx, true));
      if (topItems(true).length) png(pre + 'top.png', ctx => renderTop(ctx, true));
    }
    for (const a of P.art) if (a.on && a.exp === 'own' && a.asset && A[a.asset]) png(pre + uniq('art_' + slug(a.name)) + '.png', ctx => { unitT(ctx); drawArt(ctx, a); });
    if (e.states) {
      for (const n of list) png('states/' + stateName('state', n), ctx => {
        if (e.flat) renderStatic(ctx, true);
        renderDyn(ctx, n, { fill: e.stFill, number: e.stNumber, tier: e.stTier });
        if (e.flat) renderTop(ctx, true);
      });
    }
    if (e.kit) {
      used.clear();
      for (const it of staticItems(true).concat(topItems(true))) png('layers/' + pre + uniq(it.file) + '.png', ctx => { unitT(ctx); it.draw(ctx); });
      S.tiers.forEach((t, i) => png('layers/tiers/' + pre + 'tier_' + (i + 1) + '_' + slug(t.name) + '.png', ctx => { unitT(ctx); drawTierTitle(ctx, 0, { name: t.name, color: t.color, idx: i }); }));
      if (P.counter.overflow.on) png('layers/tiers/' + pre + 'tier_' + (S.tiers.length + 1) + '_' + slug(P.counter.overflow.name) + '.png', ctx => { unitT(ctx); drawTierTitle(ctx, 0, { name: P.counter.overflow.name, color: P.counter.overflow.color, idx: S.tiers.length }); });
      for (const n of list) png('layers/numbers/' + stateName('num', n), ctx => { unitT(ctx); drawNumber(ctx, n); });
      if (CUR.R.bar) for (const n of list) png('layers/fills/' + stateName('fill', n), ctx => { unitT(ctx); drawBarDyn(ctx, n); });
    }
    if (e.guide) png(pre + 'guide.png', ctx => renderGuide(ctx));
  }
  if (e.fx || only === 'fx') {
    for (const [kind, file] of [['hit', 'hit'], ['tier', 'tierup']]) {
      const def = P.fx[kind];
      if (!def.on) continue;
      if (P.fx.mp4) jobs.push({ path: 'fx/' + pre + file, type: 'clip', kind, def });
      if (P.fx.gif) jobs.push({ path: 'fx/' + pre + file + '.gif', type: 'gif', kind, def });
      if (P.fx.png) { const n = fxFrameCount(def); for (let i = 0; i < n; i++) jobs.push({ path: 'fx/' + pre + file + '_frames/' + pre + file + '_' + String(i).padStart(3, '0') + '.png', type: 'fxpng', kind, def, i, n }); }
    }
  }
  return jobs;
}

function ZipSink() {
  const files = [];
  this.where = 'a zip download';
  this.write = async (path, blob) => { files.push({ name: path, data: new Uint8Array(await blob.arrayBuffer()) }); };
  this.clean = async () => 0;
  this.finish = async () => { downloadBlob(new Blob(zipParts(files), { type: 'application/zip' }), slug(P.name) + '-countforge.zip'); };
  this.files = files;
}
function DirSink(root) {
  const cache = new Map();
  const dirFor = async parts => {
    let d = root, key = '';
    for (const p of parts) { key += '/' + p; let h = cache.get(key); if (!h) { h = await d.getDirectoryHandle(p, { create: true }); cache.set(key, h); } d = h; }
    return d;
  };
  this.where = 'the folder "' + root.name + '"';
  this.write = async (path, blob) => {
    const parts = path.split('/'), name = parts.pop();
    const fh = await (await dirFor(parts)).getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write(blob); await w.close();
  };
  // Removes leftovers from an earlier export. Only touches files this tool names, and only in its own subfolders.
  this.clean = async (dirPath, re, keep) => {
    let d = root;
    try { for (const p of dirPath.split('/').filter(Boolean)) d = await d.getDirectoryHandle(p); } catch (e) { return 0; }
    const kill = [];
    for await (const [name, h] of d.entries()) if (h.kind === 'file' && re.test(name) && !keep.has(name)) kill.push(name);
    for (const nm of kill) await d.removeEntry(nm);
    return kill.length;
  };
  this.finish = async () => {};
}

async function runExport(sink, only, onProgress, cancelled) {
  const W = P.canvas.w, H = P.canvas.h, fps = P.canvas.fps, e = P.exp;
  sprClear(); setEnv(W, H);
  const jobs = exportPlan(only);
  if (!jobs.length && only === 'fx') throw new Error('Both hit clips are switched off, so there is nothing to export.');
  const cv = makeCanvas(W, H), ctx = cv.getContext('2d');
  const wrote = [], notes = new Set();
  let removed = 0;
  const total = jobs.length + 2;
  const step = async (i, label) => { if (cancelled()) throw new Error('cancelled'); onProgress(i / total, label); await sleep(0); };
  try {
    for (let j = 0; j < jobs.length; j++) {
      const job = jobs[j];
      await step(j, job.path);
      setEnv(W, H);
      if (job.type === 'png') {
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, W, H);
        prep(ctx, CUR.u); job.draw(ctx);
        await sink.write(job.path, await canvasBlob(cv)); wrote.push(job.path);
      } else if (job.type === 'fxpng') {
        fxFrame(ctx, W, H, job.def, job.i, job.n, job.kind, false);
        await sink.write(job.path, await canvasBlob(cv)); wrote.push(job.path);
      } else if (job.type === 'clip') {
        const n = fxFrameCount(job.def);
        const res = await encodeClip(W, H, fps, n, (c, i) => { setEnv(W, H); fxFrame(c, W, H, job.def, i, n, job.kind, true); }, async (i, m) => { if (cancelled()) throw new Error('cancelled'); onProgress((j + i / m) / total, job.path + ' frame ' + i + ' of ' + m); });
        if (res.note) notes.add(res.note);
        await sink.write(job.path + '.' + res.ext, res.blob); wrote.push(job.path + '.' + res.ext);
      } else if (job.type === 'gif') {
        const n = fxFrameCount(job.def), cut = clamp(Math.round(P.fx.gifCut / 100 * 255), 1, 255);
        const delay = Math.max(2, Math.round(100 / fps)), gw = new GifWriter(W, H, delay);
        for (let pass = 0; pass < 2; pass++) {
          for (let i = 0; i < n; i++) {
            fxFrame(ctx, W, H, job.def, i, n, job.kind, false);
            const px = ctx.getImageData(0, 0, W, H).data;
            if (pass === 0) gw.scan(px, cut); else gw.frame(px, cut);
            await step(j + (pass * n + i) / (2 * n), job.path);
          }
          if (pass === 0) gw.build();
        }
        await sink.write(job.path, new Blob([gw.finish()], { type: 'image/gif' })); wrote.push(job.path);
      }
    }
    if (only !== 'fx') {
      if (e.clean) {
        // only files carrying this export's own prefix, so two sets with different prefixes can share a folder
        const keep = new Set(wrote.map(w => w.split('/').pop()));
        const q = pfx().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        removed += await sink.clean('states', new RegExp('^' + q + 'state_\\d+\\.png$'), keep);
        removed += await sink.clean('layers/numbers', new RegExp('^' + q + 'num_\\d+\\.png$'), keep);
        removed += await sink.clean('layers/fills', new RegExp('^' + q + 'fill_\\d+\\.png$'), keep);
        removed += await sink.clean('layers/tiers', new RegExp('^' + q + 'tier_\\d+_.*\\.png$'), keep);
      }
      await step(jobs.length, 'project file');
      const pre = pfx();
      if (e.project) { await sink.write(pre + 'countforge-project.json', new Blob([JSON.stringify(serializeProject())], { type: 'application/json' })); wrote.push(pre + 'countforge-project.json'); }
      if (e.howto) { await sink.write('HOW-TO.txt', new Blob([howToText(wrote, Array.from(notes).join(' '))], { type: 'text/plain' })); wrote.push('HOW-TO.txt'); }
    }
    await step(total - 1, 'finishing');
    await sink.finish();
  } finally {
    cv.width = cv.height = 1;
    sprClear();
  }
  return { wrote, removed, notes: Array.from(notes) };
}

// ---------- scale diagram ----------
function scaleDiagram() {
  const v = verdict(P), S = v.S, f = S.frac(v.end);
  const wrap = el('div', { class: 'scale' });
  const zones = el('div', { class: 'zones' });
  for (const z of S.zones) zones.append(el('div', { class: 'zone', style: { width: Math.max(0, (z.f1 - z.f0) * 100) + '%', background: z.color } }));
  const lit = el('div', { class: 'litwrap', style: { clipPath: 'inset(0 ' + (100 - f * 100) + '% 0 0)' } });
  for (const z of S.zones) lit.append(el('div', { class: 'lit', style: { width: Math.max(0, (z.f1 - z.f0) * 100) + '%', background: z.color } }));
  zones.append(lit, el('div', { class: 'done', style: { width: (f * 100) + '%' } }));
  const names = el('div', { class: 'names' });
  S.zones.forEach((z, i) => {
    const endAt = i < S.zones.length - 1 ? S.zones[i + 1].start - 1 : null;
    const span = S.mode === 'total' ? 'from ' + z.start : (endAt != null ? (endAt > z.start ? z.start + ' to ' + endAt : String(z.start)) : z.start + ' and up');
    names.append(el('div', { style: { width: Math.max(0, (z.f1 - z.f0) * 100) + '%' }, title: z.name + ', ' + span }, el('b', null, z.name), span));
  });
  wrap.append(zones, names);
  return wrap;
}
function verdictBox() {
  const v = verdict(P), parts = [];
  parts.push('<b>' + v.states + ' states</b>, ' + P.count.from + ' to ' + P.count.to + '.');
  parts.push(' This one ends at <b>' + v.pct + '%</b> of the bar on <b>' + escapeHtml(v.title.name || 'no title') + '</b>.');
  if (v.changes.length) parts.push(' The title changes at ' + v.changes.join(', ') + '.');
  else parts.push(' The title never changes.');
  if (v.over) parts.push(' It runs past the cap of ' + v.S.cap + '.');
  return el('div', { class: 'verdict', html: parts.join('') });
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function userLooks() { try { return JSON.parse(localStorage.getItem('countforge.looks') || '[]'); } catch (e) { return []; } }

function captureLook(name) {
  const mods = {};
  for (const id of MOD_IDS) {
    const m = P.mods[id];
    if (id === 'bar') mods.bar = clone({ plate: m.plate, housing: m.housing, pad: m.pad, track: m.track, fill: m.fill, ticks: m.ticks, gloss: m.gloss, over: m.over });

function fitArtToImage(a, img) {
  const k = Math.min(a.w / img.naturalWidth, a.h / img.naturalHeight);
  const w = img.naturalWidth * k, h = img.naturalHeight * k;
  a.x += (a.w - w) / 2; a.y += (a.h - h); a.w = w; a.h = h;
}
async function addArtFromFile(file, at) {
  try {
    const m = await addImageAsset(file);
    const { UW, UH } = unitsOf(P);
    const k = Math.min(1, 420 / m.img.naturalWidth, 320 / m.img.naturalHeight, UW * 0.5 / m.img.naturalWidth);
    const w = m.img.naturalWidth * k, h = m.img.naturalHeight * k;
    const a = newArt({ name: (file.name || 'Art').replace(/\.[a-z0-9]+$/i, '').slice(0, 40) || 'Art', asset: m.id, w, h, x: at ? at.x - w / 2 : UW / 2 - w / 2, y: at ? at.y - h / 2 : UH / 2 - h / 2 });
    P.art.push(a); selectThing({ type: 'art', id: a.id }); touch();
    return a;
  } catch (e) { toast(e.message || 'That file could not be added.', true); return null; }
}
function deleteArt(id) {
  const i = P.art.findIndex(a => a.id === id); if (i < 0) return;
  P.art.splice(i, 1);
  if (UIS.art === id) UIS.art = null;
  if (UIS.sel && UIS.sel.id === id) UIS.sel = null;
  touch(); commit(); rebuild();
}

// Every copy of this file keeps its own autosave, so a copy dropped into each video's folder remembers that video.
const SLOT = 'project:' + (location.protocol === 'file:' ? decodeURIComponent(location.pathname) : location.origin + location.pathname);
const DIRSLOT = 'exportDir:' + SLOT;
let saveWarned = false;
// Images and fonts are written once each, beside the project, so autosaving stays quick with big art loaded.
const AKEY = 'asset:' + SLOT + ':';
const savedAssets = new Set();
async function autosave() {
  try {
    const used = usedAssetIds(P);
    for (const id of used) {
      if (!A[id] || savedAssets.has(id)) continue;
      await idbSet(AKEY + id, { name: A[id].name, kind: A[id].kind, dataUrl: A[id].dataUrl, family: A[id].family });
      savedAssets.add(id);
    }
    for (const id of Array.from(savedAssets)) if (!used.has(id)) { await idbDel(AKEY + id); savedAssets.delete(id); }
    await idbSet(SLOT, { app: APP, version: VERSION, saved: new Date().toISOString(), project: P, assetIds: Array.from(used) });
    let slots = [];
    try { slots = JSON.parse(localStorage.getItem('countforge.slots') || '[]'); } catch (e) { slots = []; }
    slots = slots.filter(x => x.k !== SLOT); slots.push({ k: SLOT, t: Date.now() });
    slots.sort((a, b) => b.t - a.t);
    for (const old of slots.slice(16)) { idbDel(old.k).catch(() => {}); idbDel('exportDir:' + old.k).catch(() => {}); idbDelPrefix('asset:' + old.k + ':').catch(() => {}); }

}

  const assets = {};
  for (const id of saved.assetIds || []) {
    try { const a = await idbGet(AKEY + id); if (a) { assets[id] = a; savedAssets.add(id); } } catch (e) { /* skip a missing image */ }
  }

// Changing the frame shape keeps art where it sat relative to the edges, and swaps the row layout when the frame gets narrow.
function setCanvasSize(w, h) {
  const before = unitsOf(P), wasNarrow = before.UW < 1300;
  P.canvas.w = w; P.canvas.h = h; fixCanvas(P);
  const after = unitsOf(P), narrow = after.UW < 1300;
  if (Math.abs(after.UW - before.UW) > 0.5 || Math.abs(after.UH - before.UH) > 0.5) {
    for (const a of P.art) {
      a.w = Math.min(a.w, after.UW); a.h = Math.min(a.h, after.UH);
      a.x = r2((a.x + a.w / 2) / before.UW * after.UW - a.w / 2);
      a.y = r2(P.layout.anchor === 'top' ? a.y : a.y + (after.UH - before.UH));
    }
    if (narrow && !wasNarrow && P.layout.template === 'strip') {
      Object.assign(P.layout, { template: 'stacked', stripH: Math.max(P.layout.stripH, 230), labelW: Math.min(P.layout.labelW, 210), countW: Math.min(P.layout.countW, 150) });
      if (P.layout.credit.mode === 'under') P.layout.credit.mode = 'below';

    } else if (!narrow && wasNarrow && P.layout.template === 'stacked') {

window.addEventListener('keydown', ev => {
  const t = ev.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  const mod = ev.ctrlKey || ev.metaKey, key = ev.key.toLowerCase();
  if (!$('#modal').hidden) { if (ev.key === 'Escape' && !exporting) closeModal(); return; }
  if (mod && key === 's') { ev.preventDefault(); saveProjectFile(); return; }
  if (mod && key === 'e') { ev.preventDefault(); setTab('export'); return; }
  if (typing && !(mod && (key === 'z' || key === 'y') && t.type !== 'text' && t.type !== 'number')) return;
  if (mod && key === 'z') { ev.preventDefault(); restore(ev.shiftKey ? HIST.i + 1 : HIST.i - 1); return; }
  if (mod && key === 'y') { ev.preventDefault(); restore(HIST.i + 1); return; }
  if (mod) return;
  if (ev.key === ' ') { ev.preventDefault(); togglePlay(); return; }
  if (ev.key === 'Escape') { selectThing(null); return; }
  const s = UIS.sel;
  if ((ev.key === 'Delete' || ev.key === 'Backspace') && s && s.type === 'art') { ev.preventDefault(); deleteArt(s.id); return; }
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
  if (!arrows) return;
  ev.preventDefault();
  if (s && thingRect(s)) {
    const r = thingRect(s), k = ev.shiftKey ? 10 : 1;
    applyRect(s, { x: r.x + arrows[0] * k, y: r.y + arrows[1] * k, w: r.w, h: r.h });
    touch(); nudgeCommit();
