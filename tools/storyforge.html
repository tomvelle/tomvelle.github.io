:root{
  color-scheme:dark;
  --cork:#4a3a2b;--speck-a:#5c4934;--speck-b:#3c2f23;
  --frame:#211a14;--frame-2:#2a2119;--frame-3:#35291f;--line:#45372a;
  --chrome:#efe5d6;--chrome-2:#bba996;--chrome-3:#8f7d6c;
  --paper:#fdfdfb;--rule-red:#e28a8a;--rule-blue:#d4e2ef;--ink:#23314d;--ink-2:#5b6984;
  --sticky:#f7e68a;--sticky-ink:#3a3112;
  --string:#c7342c;--string-2:#e2483e;
  --tape:#f2c230;--tape-ink:#2b2208;
  --sel:#5cb3ff;--ok:#7cc57f;--bad:#ff8068;
  --type:'Courier Prime','Courier New',monospace;
  --ui:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Roboto,Arial,sans-serif;
  --pin-note:#9d9d9d;--pin-person:#8a63d2;--pin-place:#1d9c8c;--pin-event:#e27a1f;--pin-source:#2f7fd6;--pin-question:#d9477e;--pin-theory:#5aa83a;--pin-rule:#3a3a3a;
  --ink-note:#6b6b6b;--ink-person:#6a45b5;--ink-place:#12776a;--ink-event:#a8560c;--ink-source:#2161ad;--ink-question:#ad2f5d;--ink-theory:#3c7a22;--ink-rule:#333;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--frame);color:var(--chrome);font:14px/1.45 var(--ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
[hidden]{display:none!important}
.spacer{flex:1}
.muted{color:var(--chrome-3)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--frame-3);border:1px solid var(--line);color:var(--chrome);border-radius:6px;padding:5px 10px;font-size:13px;line-height:1.3;white-space:nowrap}
.btn:hover{background:#3e3126;border-color:#5b4b3c}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--string);border-color:#a3271f;color:#fff6f2;font-weight:600}
.btn.primary:hover{background:var(--string-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--chrome-2)}
.btn.ghost:hover{color:var(--chrome);background:var(--frame-3)}
.btn.danger{color:var(--bad)}
.btn svg{flex:none}

/* layout */
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh}
#top{display:flex;align-items:center;gap:12px;padding:0 10px 0 8px;height:50px;background:var(--frame);border-bottom:1px solid var(--line)}
.story{display:flex;align-items:center;position:relative;min-width:0}
#storyTitle{font:700 18px/1.2 var(--type);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;width:24ch;max-width:36vw;color:var(--chrome)}
#storyTitle:hover{border-color:var(--line)}
#storyTitle:focus{border-color:var(--sel);outline:none;background:var(--frame-2)}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:7px;background:var(--frame-2);border:1px solid var(--line);border-radius:8px;padding:0 10px;color:var(--chrome-3)}
.search:focus-within{border-color:var(--sel)}
.search input{flex:1;min-width:0;background:transparent;border:0;padding:7px 0;outline:none;color:var(--chrome)}
.tools{display:flex;align-items:center;gap:4px;margin-left:auto}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--chrome-3);flex:none}
.sync[data-s=ok] .dot{background:var(--ok)}
.sync[data-s=saving] .dot,.sync[data-s=dirty] .dot{background:var(--tape)}
.sync[data-s=error] .dot{background:var(--bad)}
.sync[data-s=error]{color:var(--bad)}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:270px;max-height:70vh;overflow:auto;background:var(--frame-2);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;text-align:left;background:transparent;border:0;padding:8px 10px;border-radius:6px;color:var(--chrome);gap:8px;align-items:center}
.menu button:hover{background:var(--frame-3)}
.menu button.cur{font-weight:700}
.menu button.cur::after{content:'open';margin-left:auto;font-size:11.5px;font-weight:400;color:var(--chrome-3)}
.menu .mt{font:700 14px var(--type)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#main{display:flex;min-height:0}
#inbox{width:262px;flex:none;background:var(--frame-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#boardWrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#panel{width:350px;flex:none;background:var(--frame-2);border-left:1px solid var(--line);overflow:auto}

/* inbox */
.ihead{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.ihead h2{margin:0;font-size:15px;font-weight:600}
.count{background:var(--sticky);color:var(--sticky-ink);border-radius:10px;padding:0 7px;font-size:12px;font-weight:700;line-height:18px}
.count:empty{display:none}
#jot{padding:0 12px 10px}
#jot input{width:100%;background:var(--frame);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
#jot input:focus{border-color:var(--sel);outline:none}
#inboxList{flex:1;overflow:auto;padding:6px 14px 18px;display:flex;flex-direction:column;gap:14px}
.sticky{background:var(--sticky);color:var(--sticky-ink);padding:10px 11px 8px;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.28);cursor:grab;transform:rotate(-.6deg)}
.sticky:nth-child(even){transform:rotate(.5deg)}
.smeta{font-size:11.5px;opacity:.8;display:flex;gap:8px;flex-wrap:wrap}
.sending{font-weight:700}
.stext{font:400 13.5px/1.4 var(--type);white-space:pre-wrap;word-break:break-word;margin-top:5px;max-height:9.8em;overflow:hidden}

.sticky img{display:block;max-width:100%;margin-top:7px;border-radius:2px;pointer-events:none}
.sact{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}

.playv{margin-top:7px;display:inline-flex;align-items:center;gap:5px}
.sticky audio{width:100%;margin-top:7px;height:34px}
.iempty{color:var(--chrome-3);font-size:13px;margin:4px 0}

/* next up */
#nextup{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--tape);color:var(--tape-ink);min-height:44px;border-bottom:1px solid #c79d1d;flex-wrap:wrap}

#nextup .ncard:hover{background:rgba(0,0,0,.16)}
#nextup .nq{font:700 15.5px/1.25 var(--type);flex:1;min-width:12ch}

/* board */
#board{position:relative;flex:1;overflow:hidden;background-color:var(--cork);background-image:radial-gradient(circle,var(--speck-a) 1.1px,transparent 1.6px),radial-gradient(circle,var(--speck-b) 1px,transparent 1.5px);background-size:26px 26px,41px 41px;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
#board.panning{cursor:grabbing}
#board.dropping{box-shadow:inset 0 0 0 3px var(--tape)}
#strings{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}

#strings path{fill:none}
#strings .hit{stroke:transparent;stroke-width:10;pointer-events:stroke;cursor:pointer}
#strings .vis{stroke:var(--string);stroke-linecap:round;pointer-events:none}

#strings g.sel .vis{stroke:var(--sel)}
#strings g.dim{opacity:.18}
#strings .temp{stroke:var(--string-2);stroke-dasharray:7 6;stroke-linecap:round}
#strings .ph circle{stroke:rgba(0,0,0,.35);stroke-width:1}
#strings .ph .phl{fill:rgba(255,255,255,.6);stroke:none}
#strings .ph.dim{opacity:.2}
#strings .ph.t-note circle:first-child{fill:var(--pin-note)}#strings .ph.t-person circle:first-child{fill:var(--pin-person)}#strings .ph.t-place circle:first-child{fill:var(--pin-place)}#strings .ph.t-event circle:first-child{fill:var(--pin-event)}#strings .ph.t-source circle:first-child{fill:var(--pin-source)}#strings .ph.t-question circle:first-child{fill:var(--pin-question)}#strings .ph.t-theory circle:first-child{fill:var(--pin-theory)}#strings .ph.t-rule circle:first-child{fill:var(--pin-rule)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.card{position:absolute;width:200px;background:var(--paper);color:var(--ink);border-radius:2px;padding:20px 12px 10px;box-shadow:0 1px 0 rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.3);cursor:grab}
.card.sel{outline:3px solid var(--sel);outline-offset:3px}
.card.dim{opacity:.2}
.card.locked{box-shadow:0 1px 0 rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.3),inset 0 0 0 1.5px var(--ink)}
.pin{position:absolute;left:50%;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--pin-note);box-shadow:0 2px 2px rgba(0,0,0,.4);cursor:crosshair}
.pin::after{content:'';position:absolute;left:3px;top:2.5px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.6)}
.card .pin::before{content:'';position:absolute;left:-9px;top:-9px;right:-9px;bottom:-9px;border-radius:50%}
.chead{display:flex;align-items:center;justify-content:space-between;font:600 11px/1 var(--ui);color:var(--ink-note);margin-bottom:6px}
.chead .lock{color:var(--ink)}
.ctitle{font:700 15px/1.25 var(--type);padding-bottom:6px;border-bottom:1.5px solid var(--rule-red);word-break:break-word}
.ctitle.untitled{color:var(--ink-2);font-weight:400}
.cbody{font:400 12.5px/20px var(--type);background-image:repeating-linear-gradient(to bottom,transparent 0 19px,var(--rule-blue) 19px 20px);margin-top:3px;min-height:20px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cimg{margin-top:8px;background:#e9edf3}
.cimg img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.caud{font:600 11.5px var(--ui);color:var(--ink-2);margin-top:6px;display:flex;align-items:center;gap:5px}
.ctags{font:11.5px var(--ui);color:var(--ink-2);margin-top:6px;word-break:break-word}
#marquee{position:absolute;border:1px dashed var(--sel);background:rgba(92,179,255,.12);pointer-events:none}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:2px;background:rgba(33,26,20,.88);border:1px solid var(--line);border-radius:8px;padding:3px}
.zoom .btn{padding:3px 10px}
.boardmsg{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:#eadbc6;font-size:15px;line-height:1.6;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.firstrun{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-1deg);width:min(360px,90%);background:var(--paper);color:var(--ink);padding:28px 22px 18px;border-radius:2px;box-shadow:0 2px 0 rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);user-select:text}

.firstrun input{width:100%;font:400 17px/30px var(--type);border:0;background:repeating-linear-gradient(to bottom,transparent 0 29px,var(--rule-blue) 29px 30px);padding:0;outline:none;color:var(--ink)}

/* type colors */
.t-note .pin,.pin.t-note,.pin-dot.t-note{background:var(--pin-note)}
.t-person .pin,.pin.t-person,.pin-dot.t-person{background:var(--pin-person)}
.t-place .pin,.pin.t-place,.pin-dot.t-place{background:var(--pin-place)}
.t-event .pin,.pin.t-event,.pin-dot.t-event{background:var(--pin-event)}
.t-source .pin,.pin.t-source,.pin-dot.t-source{background:var(--pin-source)}
.t-question .pin,.pin.t-question,.pin-dot.t-question{background:var(--pin-question)}
.t-theory .pin,.pin.t-theory,.pin-dot.t-theory{background:var(--pin-theory)}
.t-rule .pin,.pin.t-rule,.pin-dot.t-rule{background:var(--pin-rule)}
.card.t-person .chead{color:var(--ink-person)}.card.t-place .chead{color:var(--ink-place)}.card.t-event .chead{color:var(--ink-event)}.card.t-source .chead{color:var(--ink-source)}.card.t-question .chead{color:var(--ink-question)}.card.t-theory .chead{color:var(--ink-theory)}.card.t-rule .chead{color:var(--ink-rule)}
.pin-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}

/* panel */
.ptop{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--frame-2);z-index:2}

.pTitle{display:block;width:100%;font:700 17px/1.3 var(--type);color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--rule-red);padding:2px 0 7px;outline:none;resize:none;overflow:hidden}

.psec{padding:2px 14px 12px}
.psec h3{font-size:12.5px;font-weight:600;color:var(--chrome-2);margin:12px 0 6px}
.psec p{margin:0 0 8px}
.pTags{width:100%;background:var(--frame);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.pTags:focus{border-color:var(--sel);outline:none}
.plinks{display:flex;flex-direction:column;gap:4px}
.plink{display:flex;align-items:center;gap:4px}
.plink .go{flex:1;min-width:0;display:flex;align-items:center;gap:7px;text-align:left;background:var(--frame-3);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:700 13px var(--type);color:var(--chrome);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.plink .go:hover{border-color:#5b4b3c}
.hint{color:var(--chrome-3);font-size:13px}
.pmedia figure{margin:0 0 10px}
.pmedia img{max-width:100%;display:block;border-radius:3px}
.pmedia audio{width:100%}
.pmeta{font-size:12px;color:var(--chrome-3);padding:4px 14px 0;margin:0}

/* drawer + table */
#drawer{background:var(--frame);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#drawerGrip{height:6px;cursor:ns-resize;flex:none}
#drawerGrip:hover{background:var(--frame-3)}
#drawerHead{display:flex;align-items:center;gap:8px;padding:2px 12px 8px;flex-wrap:wrap}
#drawerHead select{background:var(--frame-3);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px}
#drawerToggle svg{transition:transform .15s}
#drawerToggle[aria-expanded=false] svg{transform:rotate(-90deg)}
#fCount{font-size:12.5px}
#bulk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px 6px 3px 10px;border-radius:8px;background:rgba(92,179,255,.12);border:1px solid rgba(92,179,255,.35)}
#selCount{font-size:13px;font-weight:600;color:#a9d6ff;margin-right:2px}
#tableWrap{overflow:auto;min-height:0}
#table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
#table th{position:sticky;top:0;z-index:1;background:var(--frame);text-align:left;font-weight:600;color:var(--chrome-2);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);user-select:none;white-space:nowrap}
#table th[data-k]{cursor:pointer}
#table th[data-k]:hover{color:var(--chrome)}

#table input[type=text],#table select{width:100%;background:transparent;border:1px solid transparent;border-radius:4px;padding:3px 5px;color:var(--chrome)}
#table input[type=text]:hover,#table select:hover{border-color:var(--line)}
#table input[type=text]:focus,#table select:focus{border-color:var(--sel);background:var(--frame-2);outline:none}
#table .tTitle{font:700 13.5px var(--type)}
#table .tsel{display:flex;align-items:center;gap:4px}
#table .ck{width:34px;text-align:center}
#table .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--chrome-2)}
#table .when{color:var(--chrome-3);white-space:nowrap}
#table .tempty{color:var(--chrome-3);padding:14px 10px}
.tLock{background:transparent;border:1px solid var(--line);border-radius:10px;padding:1px 9px;font-size:12px;color:var(--chrome-2)}
.tLock.on{color:var(--tape);border-color:#6b5520}

/* modal, toasts */
#modal{position:fixed;inset:0;background:rgba(10,7,5,.62);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}

#modal label input,#modal label select,#modal textarea{display:block;width:100%;margin-top:4px;background:var(--frame);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--chrome)}

.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;color:var(--chrome-2)}

.row.end{justify-content:flex-end}
.msg{font-size:13px;min-height:1.2em}
.msg.bad{color:var(--bad)}
.qr{background:#fff;padding:12px;border-radius:8px;width:fit-content;margin:12px auto}
.qr svg{display:block;width:240px;height:240px}
.warn{color:var(--tape)!important;font-size:13px}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{pointer-events:auto;background:#120e0b;color:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:13.5px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}

.ctop{display:flex;align-items:center;gap:6px}
.ctop h1{margin:0;font:700 26px/1.2 var(--type);flex:1;color:var(--chrome)}
#cText{width:100%;min-height:32vh;background:var(--sticky);color:var(--sticky-ink);border:0;border-radius:3px;padding:14px;font:400 18px/1.5 var(--type);resize:vertical;box-shadow:0 2px 0 rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35)}

.cabout{display:flex;align-items:center;gap:8px;background:var(--frame-3);border-left:3px solid var(--tape);padding:8px 6px 8px 10px;font-size:13.5px}

.crec{display:flex;align-items:center;gap:8px;color:#ffb3a8;font-size:14px;font-weight:600}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--string-2);animation:blink 1s steps(2,start) infinite}

.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtns .btn{justify-content:center;padding:13px;font-size:15px}
#cTalk.rec{background:#5a1f1a;border-color:var(--string)}
#cGo{justify-content:center;padding:16px;font-size:19px;border-radius:10px}
.cstatus{margin:0;font-size:13px;color:var(--chrome-2);text-align:center}
.ctoday{margin:0;font-size:13px;color:var(--chrome-3);text-align:center}
.cnext{background:var(--tape);color:var(--tape-ink);padding:12px 14px;border-radius:4px;margin-top:6px}
.cnext .nlrow{display:flex;align-items:center;gap:8px}

.cnext .row{margin-top:0}
#cBoard{align-self:center;margin-top:4px}

@media (max-width:900px){#inbox{width:220px}#panel{width:300px}}
#app{grid-template-columns:minmax(0,1fr)}

@media (max-width:760px){
  #inbox{display:none}

  .zoom{right:8px;bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Story Forge v1. A corkboard for building stories, made for Tom.
   No AI anywhere in here. It holds your stuff, shows you the holes, and saves to your own GitHub repo. */
(function () {
'use strict';

// ---------------------------------------------------------------- types and prompts
const TYPES = {
  note:     { label: 'Note', fields: [] },
  person:   { label: 'Person', fields: [['knows', 'What do they know?'], ['says', 'What do they say happened?'], ['hides', 'What are they hiding?']] },
  place:    { label: 'Place', fields: [['why', 'Why does it matter?']] },
  event:    { label: 'Event', fields: [['when', 'When did it happen?'], ['who', 'Who knows it happened?']] },
  source:   { label: 'Source', fields: [['what', 'What is it? Tape, document, photo?'], ['reveals', 'What does it reveal?'], ['how', 'How does the host get it?']] },
  question: { label: 'Question', fields: [['answer', 'What is the real answer?'], ['payoff', 'Where does it pay off?']] },
  theory:   { label: 'Theory', fields: [['who', 'Who believes it?'], ['truth', 'How true is it?']] },

// ---------------------------------------------------------------- media
const mediaURLs = new Map();
function queueMedia(path) {

  return null;
}
function mediaURL(path, type) {

  const p = (async () => {
    const qm = queueMedia(path);
    if (qm) return URL.createObjectURL(new Blob([qm.buf], { type: qm.type || type }));
    if (!connected()) throw new Error('not connected');
    const blob = await GH.getBlob(path);

}

      else { const img = new Image(); img.alt = ''; img.draggable = false; img.src = u; el.appendChild(img); }

}

    catch (e) { m = { kind: 'image', type: f.type, buf: await f.arrayBuffer() }; }
  } else if (/^audio\//.test(f.type)) m = { kind: 'audio', type: f.type, buf: await f.arrayBuffer() };

  const path = 'media/d' + now().toString(36) + rid() + '.' + extFor(m.type, m.kind);
  await GH.putFile(path, bytesToB64(new Uint8Array(m.buf)), 'Add ' + m.kind);
  mediaURLs.set(path, Promise.resolve(URL.createObjectURL(new Blob([m.buf], { type: m.type }))));

// a catch is anything you grab fast: text, photos, voice. It always goes to the queue first, then up to the repo inbox.
async function makeCatch({ text, media, about, from }) {
  const d = new Date();
  const stamp = d.toISOString().replace(/[-:TZ.]/g, '').slice(0, 14);
  const id = 'c' + stamp + rid();
  const item = { id, t: d.getTime(), text: text || '', about: about || null, from: from || 'desk', media: [] };
  let n = 0;
  for (const m of media || []) {
    n++;
    item.media.push({ kind: m.kind, type: m.type, buf: m.buf, w: m.w || 0, h: m.h || 0, dur: m.dur || 0, path: 'media/' + id + '-' + n + '.' + extFor(m.type, m.kind), up: false });
  }
  await Q.put(item);
  const td = LS.get('today', { d: '', n: 0 });
  LS.set('today', { d: todayKey(), n: (td.d === todayKey() ? td.n : 0) + 1 });
  await refreshQueue();
  if (mode === 'board') renderInbox();
  flushQueue();
  return item;
}
let flushing = false;

  flushing = true;
  let sent = 0;
  try {
    const items = await Q.all();
    for (const it of items) {
      for (const m of it.media) {
        if (m.up) continue;
        try { await GH.putFile(m.path, bytesToB64(new Uint8Array(m.buf)), 'Catch ' + m.kind); }
        catch (e) { if (e.status !== 422) throw e; }
        m.up = true; await Q.put(it);
      }
      const json = { id: it.id, t: it.t, text: it.text, about: it.about, from: it.from, media: it.media.map(m => ({ path: m.path, kind: m.kind, type: m.type, w: m.w, h: m.h, dur: m.dur })) };
      let sha = null;
      try { sha = await GH.putFile('inbox/' + it.id + '.json', strToB64(JSON.stringify(json)), 'Catch'); }
      catch (e) { if (e.status !== 422) throw e; }
      for (const m of it.media) {
        if (m.buf && !mediaURLs.has(m.path)) mediaURLs.set(m.path, Promise.resolve(URL.createObjectURL(new Blob([m.buf], { type: m.type }))));
      }
      await Q.del(it.id);

      sent++;
    }
    if (sent) saveInboxCache();
    if (net.s === 'offline' || net.s === 'error' || net.s === 'local') setNet(S.dirty ? 'dirty' : 'ok');
  } catch (e) { setNet(e.offline ? 'offline' : 'error', e); }
  finally {
    flushing = false;
    await refreshQueue();
    renderQueueState();
    if (mode === 'board') renderInbox();

async function connectTo(owner, repo, token) {
  let res;
  try {
    res = await fetch('https://api.github.com/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo),
      { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
  } catch (e) { throw new Error('Could not reach GitHub. Check your connection.'); }
  if (res.status === 401) throw new Error('GitHub did not accept that token. Make sure you copied all of it.');
  if (!res.ok) throw new Error('Can not see ' + owner + '/' + repo + '. Check the names, and that the token was given access to that repo.');
  const info = await res.json();
  const prevCfg = cfg;
  cfg = { owner: (info.owner && info.owner.login) || owner, repo: info.name || repo, token };
  try {
    const mk = await GH.getFile('storyforge.txt');
    if (!mk) await GH.putFile('storyforge.txt', strToB64('This repo holds your Story Forge.\n\nstories/  one folder per story, with story.json inside\ninbox/    catches waiting to be sorted\nmedia/    photos and voice notes\n\nEvery save is a commit, so the History tab has every version.\n'), 'Set up Story Forge');
  } catch (e) {
    cfg = prevCfg;
    if (e.status === 403 || e.status === 404) throw new Error('The token can read that repo but can not write to it. Make one with Contents set to Read and write.');
    throw new Error(errText(e));
  }
  LS.set('cfg', cfg);
  migrateLocal();
  return info;
}
function migrateLocal() {
  const loc = LS.get('stories:local', []);
  if (!loc.length) return;
  const list = LS.get(nsKey('stories'), []);
  for (const s of loc) {
    const data = LS.get('story:local:' + s.slug, null);
    if (!data || !data.story) continue;
    const ex = LS.get(localKey(s.slug), null);
    const story = ex && ex.story ? mergeStories(ex.story, data.story) : normalize(data.story);
    LS.set(localKey(s.slug), { story, sha: ex ? ex.sha : null, dirty: true });
    if (!list.find(x => x.slug === s.slug)) list.push({ slug: s.slug, title: s.title });
  }
  LS.set(nsKey('stories'), list);
  LS.set('stories:local', []);
}

async function startRec() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { toast('This browser can not record. Your keyboard\'s mic button can type what you say instead.'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { toast('No microphone access. Allow it in your browser settings to record.'); return; }
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  let mr;
  try { mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
  catch (e) { stream.getTracks().forEach(t => t.stop()); toast('Could not start recording.'); return; }
  const chunks = [], t0 = now();
  mr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  const done = new Promise(res => {
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const type = (mr.mimeType || mime || 'audio/webm').split(';')[0];
      const blob = new Blob(chunks, { type });
      if (blob.size) P.pend.push({ kind: 'audio', type, buf: await blob.arrayBuffer(), dur: Math.round((now() - t0) / 1000), url: URL.createObjectURL(blob) });
      renderPend(); res();
    };
  });
  mr.start(1000);
  P.rec = { mr, t0, done, timer: setInterval(tickRec, 500), cap: setTimeout(stopRec, 180000) };
  renderRec();
}

  if (!P.rec) return;

  renderRec();
  await r.done;

    else if (b.dataset.act === 'answer') answerWithCatch(id);
    else if (b.dataset.act === 'toss') {
      if (b.dataset.sure) tossCatch(id);
      else { b.dataset.sure = '1'; b.textContent = 'Toss it?'; setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = 'Toss'; } }, 3000); }
    }
  });
  list.addEventListener('dragstart', e => {
    const s = e.target.closest('[data-catch]'); if (!s) return;
    e.dataTransfer.setData('text/sf-catch', s.dataset.catch); e.dataTransfer.effectAllowed = 'copy';
  });
  $('#allToBoard').onclick = placeAllCatches;
  $('#jot').addEventListener('submit', async e => {
    e.preventDefault();
    const inp = $('#jotText'); const v = inp.value.trim(); if (!v) return;
    inp.value = '';
    await makeCatch({ text: v, from: 'desk' });
  });

  // keys
  document.addEventListener('keydown', e => {
    if (mode !== 'board' || !$('#modal').hidden) return;
    const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (mod && k === 'f') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
    if (typing) return;
    if (!S.story) return;
    if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (mod && k === 'y') { e.preventDefault(); redo(); return; }

      if (selLink && !sel.size) { e.preventDefault(); cutString(selLink); }
      else if (sel.size) { e.preventDefault(); deleteCards(Array.from(sel)); }

    else if (k === 'n') { e.preventDefault(); addCardAtCenter(); }
    else if (k === 'l') { const ids = Array.from(sel); if (ids.length === 2) tieString(ids[0], ids[1]); else toast('Select exactly two cards to tie them.'); }
    else if (k === 'k') { const ids = Array.from(sel); if (ids.length) { const any = ids.some(id => S.story.cards[id] && !S.story.cards[id].lock); setLock(ids, any); } }

}
let softRAF = 0;

}
function bootBoardMode() {

  $('#catchView').hidden = true; $('#app').hidden = false;
  if (!boardBooted) { boardBooted = true; wireBoard(); bootBoard(); }
  else { refreshQueue().then(() => { renderAll(); if (connected()) poll(); }); }
  setNet(connected() ? (S.dirty ? 'dirty' : 'ok') : 'local');
}

// ---------------------------------------------------------------- start
function start() {
  handleSetupHash();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (S.dirty) saveNow(); }
    else if (mode === 'board') poll();
    else if (mode === 'catch') { flushQueue(); loadPhoneNext(); }
  });
  window.addEventListener('online', () => { flushQueue(); if (mode === 'board') { if (S.dirty) saveNow(); poll(); } });
  window.addEventListener('focus', () => { if (mode === 'board') poll(); });
  window.addEventListener('hashchange', () => {
    if (location.hash === '#catch' && mode !== 'catch') bootCatch();
    else if (location.hash === '#board' && mode !== 'board') bootBoardMode();
  });
  const h = location.hash;
  const want = h === '#board' ? 'board' : h === '#catch' ? 'catch' : (matchMedia('(max-width: 760px)').matches ? 'catch' : 'board');
  if (want === 'catch') bootCatch(); else bootBoardMode();
  if (justSetUp) toast('Connected. What you catch here lands on your board.', null, 5000);
}
if (TEST) window.__sf = { S, IB, cfg: () => cfg, holes, mergeStories, normalize, cleanupTaken, refreshInbox, flushQueue, saveNow, poll, sel, V: () => V, unb64url, b64url, strToB64, b64ToStr, slugify };
start();
})();
